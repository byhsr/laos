name: Release

# Builds installers for Windows, macOS and Linux and attaches them to a GitHub
# Release. Trigger by pushing a version tag, with or without a leading "v":
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both macOS targets are built so the release ships an Intel and an Apple Silicon app.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            pkg-config \
            cmake \
            clang \
            libclang-dev

      # whisper.cpp is compiled by whisper-rs through CMake, and bindgen needs
      # libclang. Both are native on macOS/Windows runners except for LLVM on
      # Windows, which is installed but not on PATH.
      - name: Point bindgen at LLVM
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      # The macOS matrix cross-builds x86_64 from an arm64 runner, so CMake has
      # to be told which architecture whisper.cpp should target.
      - name: Configure macOS architecture
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          case "${{ matrix.args }}" in
            *aarch64*) arch=arm64 ;;
            *)         arch=x86_64 ;;
          esac
          echo "CMAKE_OSX_ARCHITECTURES=$arch" >> "$GITHUB_ENV"
          echo "whisper.cpp will target $arch"

      - name: Install frontend dependencies
        run: npm ci

      # The tag is the source of truth. Without this the bundles keep the version
      # checked into tauri.conf.json, so a "v0.1.3" tag can ship "0.1.2" assets and
      # an updater manifest that never prompts 0.1.2 clients to update.
      - name: Sync app version from tag
        shell: bash
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing version $VERSION from tag $GITHUB_REF_NAME"
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;

            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = version;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

            const confPath = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(confPath, "utf8"));
            conf.version = version;
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + "\n");

            const cargoPath = "src-tauri/Cargo.toml";
            const cargo = fs.readFileSync(cargoPath, "utf8");
            fs.writeFileSync(cargoPath, cargo.replace(/^version = ".*"$/m, `version = "${version}"`));
          '

      - name: Build and attach to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing. Generate with `npm run tauri signer generate` and add both
          # values as repository secrets, or the build produces no updater artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Local Agent OS ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your platform from the assets below.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
