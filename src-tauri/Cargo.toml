[package]
name = "local-agent-os"
version = "0.2.3"
description = "A local-first desktop agent workspace"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables the multi-webview API (Window::add_child) used by the
# embedded mini-browser panel.
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
# System-wide voice hotkey (fires even when the window is hidden in the tray).
tauri-plugin-global-shortcut = "2"
# OS-level toasts for reminders, insights and finished background work.
tauri-plugin-notification = "2"
# Native folder / file pickers (skills import & export).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# base64 decode for audio handed to the composer (the vision path never decodes).
base64 = "0.23.1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
chrono = { version = "0.4", features = ["clock"] }
# IANA timezones for the user's configured zone (default IST) — reminders, due
# dates and the classifier's "right now it is…" all resolve against it.
chrono-tz = "0.10"
async-trait = "0.1.92"
futures-util = "0.3"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "time", "sync"] }
# Parser only — the built-in HTML writer and CLI are not used.
pulldown-cmark = { version = "0.13.4", default-features = false }
portable-pty = "0.9.0"
# VT parser: renders the screen from the raw PTY byte stream (for the Telegram relay).
vt100 = "0.15"

# OS credential store — the vault every secret lives in (see src/vault.rs).
[target."cfg(windows)".dependencies.keyring]
version = "3"
features = ["windows-native"]

[target."cfg(target_os = \"macos\")".dependencies.keyring]
version = "3"
features = ["apple-native"]

[target."cfg(target_os = \"linux\")".dependencies.keyring]
version = "3"
features = ["sync-secret-service"]

[target."cfg(windows)".dependencies]
arboard = "3.6.1"
enigo = "0.6.1"
# WebView2 COM bindings, for the microphone permission reset (ICoreWebView2Profile4).
webview2-com = "0.39"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Shutdown", "Win32_UI_Shell"] }
xcap = "0.9.8"
